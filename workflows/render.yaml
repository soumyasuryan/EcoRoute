# Render Blueprint specification for EcoRoute Workflows
# Docs: https://render.com/docs/workflows

services:
  # 1. Render Workflow Service
  - type: workflow
    name: ecoroute-aqi-workflow
    runtime: node
    rootDir: workflows
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  # 2. Render Cron Job to trigger the workflow every 2 minutes
  - type: cron
    name: ecoroute-aqi-cron-trigger
    runtime: node
    rootDir: workflows
    schedule: "*/2 * * * *"
    buildCommand: npm install
    startCommand: npm run trigger
    envVars:
      - key: NEO4J_URI
        fromService:
          type: workflow
          name: ecoroute-aqi-workflow
          envVarKey: NEO4J_URI
      - key: NEO4J_USER
        fromService:
          type: workflow
          name: ecoroute-aqi-workflow
          envVarKey: NEO4J_USER
      - key: NEO4J_PASSWORD
        fromService:
          type: workflow
          name: ecoroute-aqi-workflow
          envVarKey: NEO4J_PASSWORD
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK_SLUG
        value: ecoroute-aqi-workflow/aqi-simulator
