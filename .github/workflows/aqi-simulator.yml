name: EcoRoute AQI Background Simulator

on:
  # Run every 10 minutes automatically in the background for free
  schedule:
    - cron: '*/10 * * * *'
  # Allow manual trigger from GitHub Actions dashboard at any time
  workflow_dispatch:

jobs:
  simulate-aqi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'workflows/package-lock.json'

      - name: Install dependencies
        working-directory: ./workflows
        run: npm ci

      - name: Run AQI Simulation
        working-directory: ./workflows
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: npm run once
